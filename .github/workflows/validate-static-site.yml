name: Validate static site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/motion.js

      - name: Validate static site integration
        run: python3 tests/validate_static_site.py
